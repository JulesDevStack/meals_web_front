<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <title>Mon Application</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="workshop-details.css">
    <script src="workshop-details.js" type="module" defer></script>
</head>

<body>
    <header>
        <div class="header-placement">
            <h1 class="h1-workshop-details">Workshop details</h1>
            <div>
                <img class="logoWorkshopDetails" src="../images/mealsfestival.png" alt="Logo">
                <hr class="hrWorkshopDetails">
            </div>
        </div>

    </header>
    <div class="container">
        <div class="partie-gauche-workshop-details">
            <main>
                <form id="update_form" action="" method="post">
                    <div class="workshop-columns">
                        <div class="left-columns">
                            <div class="form-row-name">
                                <label class="form-label-workshop-details" for="name">Name</label>
                                <input type="text" id="name" name="nom" placeholder="Entrez votre nom" required>

                            </div>

                            <div class="form-row-name">
                                <label class="form-label-workshop-details" for="category">Category</label>
                                <select id="category">
                                    <option value="">Chargement des catégories...</option>
                                </select>
                            </div>

                            <div class="form-row-name">
                                <label class="form-label-workshop-details" for="start-time">Start time</label>
                                <div class="hstack">
                                    <input type="time" id="hour-start" name="hour_start" placeholder="Heure" required>
                                    <input type="date" id="day-start" name="day_start" placeholder="Date" required>
                                </div>
                            </div>

                            <div class="form-row-name">
                                <label class="form-label-workshop-details" for="end-time">End time</label>
                                <div class="hstack">
                                    <input type="time" id="hour-end" name="hour_end" placeholder="Heure" required>
                                    <input type="date" id="day-end" name="day_end" placeholder="Date" required>
                                </div>
                            </div>

                            <div class="form-row-name">
                                <label class="form-label-workshop-details" for="capacity">Max Capacity</label>
                                <input type="number" id="capacity" name="capacity"
                                    placeholder="Entrez une capacité maximale" required>
                            </div>

                            <div class="form-columns">
                                <div class="description-container">
                                    <label class="form-label-workshop-details"
                                        for="description-details">Description</label>
                                    <textarea id="description-details" name="description"
                                        placeholder="Description de l'atelier" rows="5" required></textarea>
                                </div>
                            </div>
                        </div>

                        <div class="right-columns">

                            <div class="form-columns">
                                <label class="form-label-workshop-details">Participant</label>
                                <div id="participants-list"></div>
                            </div>
                        </div>
                    </div>
                    <div class="button-container">
                        <div>
                            <button id="btn-cancel">Cancel</button>
                            <button id="btn-delete">Delete Workshop</button>
                        </div>
                        <button id="btn-update" type="submit">Update Workshop</button>
                    </div>
                </form>
            </main>
        </div>
    </div>
</body>

</html>
