<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Meals Festival - Evénements</title>
	<link rel="stylesheet" href="/style.css">
	<link rel="stylesheet" href="calendar.css">
	<script src="calendar.js" defer></script>
</head>
<body id="page_calendar">
<header>
	<nav>
		<div class="header_logo">
			<img src="/images/logo.svg" alt="logo meals festival">
			<div class="divider"></div>
		</div>
		<a href="register_form.html">Create a </br> workshop</a>
	</nav>
	<section>
		<h1>List of workshops</h1>
		<article>
			<p>Week <span id="workshop_list_week_counter">1</span></p>
			<button id="workshop_list_week_prev">
				<img src="/images/chevron.svg" alt="workshop list previous 1 week">
			</button>
			<button id="workshop_list_week_next">
				<img src="/images/chevron.svg" alt="workshop list next 1 week">
			</button>
		</article>
	</section>
</header>
<main>
	<section id="calendar">
		<article class="day">
			<p class="day_title">Monday</p>
			<div class="day_body">

			</div>
		</article>
		<article class="day">
			<p class="day_title">Tuesday</p>
			<div class="day_body">
			</div>
		</article>
		<article class="day">
			<p class="day_title">Wednesday</p>
			<div class="day_body">
			</div>
		</article>
		<article class="day">
			<p class="day_title">Thursday</p>
			<div class="day_body">
			</div>
		</article>
		<article class="day">
			<p class="day_title">Friday</p>
			<div class="day_body">
			</div>
		</article>
		<article class="day">
			<p class="day_title">Saturday</p>
			<div class="day_body">
			</div>
		</article>
		<article class="day">
			<p class="day_title">Sunday</p>
			<div class="day_body">
			</div>
		</article>
	</section>
</main>
</body>
</html>
