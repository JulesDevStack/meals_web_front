<html lang="fr">

        <div class="partie-gauche">
            <img class="logo" src="images/mealsfestival.png" alt="Logo">
        </div>

 
        <div class="partie-droite">
            <h1>Connexion</h1>
            <hr>
            <form action="calendar.html" method="post">
                <div>
                    <label for="nom"> </label>
                    <input type="email" id="courriel" name="courriel" , placeholder="Entrez votre email" , required>
                </div>

                <div>
                    <label for="courriel"> </label>
                    <input type="password" id="motdepasse" name="motdepasse" placeholder="Entrez votre mot de passe" ,
                        required>
                </div>

                <div>
                    <button type="submit"> Entrer </button>
                </div>
            </form>

        </div>

    </div>

    <!-- Lien vers JavaScript -->
    <script src="script.js"></script>
</body>
