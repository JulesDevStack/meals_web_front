<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a Workshop</title>
    <link rel="stylesheet" href="Create_workshop.css">
    <script src="create_workshop.js" defer></script>
</head>

<body>
    <div class="container">
        <form class="workshop-form" action="" method="post" novalidate>
            <div class="left-gauche-workshop">
                <div class="header-workshop">
                    <img class="logoWorkshop" src="images/mealsfestival.png" alt="Meals Festival Logo">
                    <hr class="hrWorkshop">
                </div>
                <h1 class="h1-workshop">Create a Workshop</h1>
                <div class="form-group">
                    <label class="form-label" for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter workshop name" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="category">Category</label>
                    <select id="category" name="category" required>
                        <option value="">Select a category</option>
                    </select>
                    <!--   <input type="text" id="category" name="category" placeholder="Enter category" required>-->
                </div>

                <div class="form-group">
                    <label class="form-label" for="start-time">Start Time</label>
                    <div class="date-time-group">
                        <input type="date" id="start-date" required>
                        <input type="time" id="start-time" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="end-time">End Time</label>
                    <div class="date-time-group">
                        <input type="date" id="end-date" required>
                        <input type="time" id="end-time" required>
                    </div>
                </div>
            </div>
            <div class="right-section-workshop">
                <button type="submit" class="button-workshop">
                    Create Workshop
                </button>
                <div class="form-group">
                    <label class="form-label" for="capacity">Maximum Capacity</label>
                    <input type="number" id="capacity" name="capacity" placeholder="Enter maximum capacity" min="1"
                        required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="description">Description</label>
                    <textarea id="description" name="description" placeholder="Enter workshop description"
                        required></textarea>
                </div>


            </div>

        </form>

    </div>
</body>

</html>
